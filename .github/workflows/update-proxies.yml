name: Update proxy list

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate proxy snapshot
        run: |
          python -m proxyhealthlist update --limit 2000 --workers 120 --timeout 5
      - name: Commit changes
        run: |
          git config user.name "proxyhealthlist-bot"
          git config user.email "proxyhealthlist-bot@users.noreply.github.com"
          git add proxies stats
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update proxy snapshot"
            git push
          fi
