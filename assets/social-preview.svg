<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#0f2a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.5">
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
  </g>

  <!-- eyebrow -->
  <text x="96" y="150" fill="#2dd4bf" font-size="26" font-weight="700" letter-spacing="3">FREE · VERIFIED · UPDATED HOURLY</text>

  <!-- title -->
  <text x="94" y="250" fill="#f8fafc" font-size="82" font-weight="800">Free Proxy List</text>
  <text x="96" y="340" fill="#e2e8f0" font-size="46" font-weight="600">HTTP · SOCKS4 · SOCKS5</text>

  <!-- subtitle -->
  <text x="96" y="410" fill="#94a3b8" font-size="30" font-weight="400">Health-checked proxies as TXT · JSON · CSV — no signup, no credit card.</text>

  <!-- pills -->
  <g font-size="26" font-weight="700">
    <rect x="96" y="470" width="230" height="64" rx="32" fill="#134e4a"/>
    <text x="211" y="512" fill="#5eead4" text-anchor="middle">Verified hourly</text>
    <rect x="346" y="470" width="210" height="64" rx="32" fill="#0c4a6e"/>
    <text x="451" y="512" fill="#7dd3fc" text-anchor="middle">Stable CDN</text>
    <rect x="576" y="470" width="200" height="64" rx="32" fill="#3b0764"/>
    <text x="676" y="512" fill="#d8b4fe" text-anchor="middle">No signup</text>
  </g>

  <!-- accent bar -->
  <rect x="96" y="576" width="1088" height="6" rx="3" fill="url(#accent)"/>

  <!-- url -->
  <text x="96" y="616" fill="#64748b" font-size="24" font-weight="600">github.com/xyzs996/free-proxy-health-list</text>
</svg>
